name: Build
on:
  push:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.2.0
        with:
          cache-provider: basic

      - name: Set up JDK 21
        uses: actions/setup-java@v5.4.0
        with:
          distribution: 'temurin'
          java-version: 21
          check-latest: true

      - name: Resolve build id from Maven
        id: build-id
        run: node .github/get-build-id.mjs
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}

      - name: Build with Gradle
        run: ./gradlew build -PbuildId=${{ steps.build-id.outputs.number }}

      - name: Publish to Maven (snapshots)
        run: ./gradlew publish -PbuildId=${{ steps.build-id.outputs.number }}
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}

      - name: Upload Artifacts to GitHub
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dupersunited-build-${{ steps.build-id.outputs.number }}
          path: build/libs/
          if-no-files-found: error