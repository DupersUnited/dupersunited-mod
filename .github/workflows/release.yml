name: Release
on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - name: Tag matches mod version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(grep '^version=' gradle.properties | cut -d= -f2)"
          [ "$tag" = "$version" ] || { echo "tag $tag != version $version from gradle.properties"; exit 1; }

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.2.0
        with:
          cache-provider: basic

      - name: Set up JDK 21
        uses: actions/setup-java@v5.4.0
        with:
          distribution: 'temurin'
          java-version: 21
          check-latest: true

      - name: Build release with Gradle
        run: ./gradlew build -Prelease=true

      - name: Publish to Maven (releases)
        run: ./gradlew publish -Prelease=true
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}

      - name: Publish GitHub Release
        run: gh release create "$GITHUB_REF_NAME" build/libs/*.jar --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Bump version for next release
        run: |
          git remote set-url origin "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin main
          git checkout -B main origin/main

          current="$(grep '^version=' gradle.properties | cut -d= -f2)"
          major="${current%%.*}"
          rest="${current#*.}"
          minor="${rest%%.*}"
          patch="${rest#*.}"
          next="$major.$minor.$((patch + 1))"

          sed -i "s/^version=.*/version=$next/" gradle.properties
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: bump version [skip ci]"
          git push origin main
