name: Release
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+*'
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.0
        with:
          persist-credentials: false

      - name: Tag matches mod version
        run: |
          tag="${GITHUB_REF_NAME}"
          version="$(grep '^version=' gradle.properties | cut -d= -f2)"
          [ "$tag" = "$version" ] || { echo "tag $tag != version $version from gradle.properties"; exit 1; }

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.2.0
        with:
          cache-provider: basic

      - name: Set up JDK 21
        uses: actions/setup-java@v5.4.0
        with:
          distribution: 'temurin'
          java-version: 21
          check-latest: true

      - name: Build release with Gradle
        run: ./gradlew build -Prelease

      - name: Publish to Maven (releases)
        run: ./gradlew publish -Prelease
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}

      - name: Publish GitHub Release
        run: gh release create "$GITHUB_REF_NAME" build/libs/*.jar --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
